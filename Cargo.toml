[workspace]
resolver = "3"
members = [
    "cimientos/valor",
    "cimientos/comprimir",
    "motor-js/gc",
    "motor-js/regex",
    "motor-js/parser",
    "motor-js/frontend",
    "motor-js/objetos",
    "motor-js/vm",
    "web/html",
    "web/css",
    "web/estilo",
    "web/dom",
    "web/maquetacion",
    "grafico/texto",
    "grafico/vector",
    "grafico/imagen",
    "grafico/video",
    "grafico/gpu",
    "grafico/pintar",
    "navegador/ventana",
    "red/red",
    "bancos/gc",
    "bancos/frontend",
    "bancos/vm",
    "bancos/web",
    "bancos/imagen",
    "herramientas/guardianes",
    "herramientas/ver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Eddi Andreé Salazar Matos"]

[workspace.dependencies]
quimera-valor = { path = "cimientos/valor" }
quimera-comprimir = { path = "cimientos/comprimir" }
quimera-vector = { path = "grafico/vector" }
quimera-gc = { path = "motor-js/gc" }
quimera-regex = { path = "motor-js/regex" }
quimera-parser = { path = "motor-js/parser" }
quimera-frontend = { path = "motor-js/frontend" }
quimera-objetos = { path = "motor-js/objetos" }
quimera-vm = { path = "motor-js/vm" }
quimera-html = { path = "web/html" }
quimera-css = { path = "web/css" }
quimera-estilo = { path = "web/estilo" }
quimera-dom = { path = "web/dom" }
quimera-maquetacion = { path = "web/maquetacion" }
quimera-texto = { path = "grafico/texto" }
quimera-imagen = { path = "grafico/imagen" }
quimera-video = { path = "grafico/video" }
quimera-gpu = { path = "grafico/gpu" }
quimera-pintar = { path = "grafico/pintar" }
quimera-red = { path = "red/red" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

# Las pruebas ejecutan benchmarks enteros (Richards, RegExp...): un poco de optimización
# las hace varias veces más rápidas sin perder las comprobaciones de desbordamiento.
[profile.dev]
opt-level = 1
