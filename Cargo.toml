[workspace]
resolver = "3"
members = [
    "cimientos/valor",
    "motor-js/gc",
    "motor-js/regex",
    "motor-js/frontend",
    "motor-js/objetos",
    "motor-js/vm",
    "web/html",
    "web/css",
    "web/estilo",
    "web/maquetacion",
    "grafico/texto",
    "grafico/gpu",
    "grafico/pintar",
    "navegador/ventana",
    "bancos/gc",
    "bancos/frontend",
    "bancos/vm",
    "bancos/web",
    "herramientas/guardianes",
    "herramientas/ver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Eddi Salazar"]

[workspace.dependencies]
quimera-valor = { path = "cimientos/valor" }
quimera-gc = { path = "motor-js/gc" }
quimera-regex = { path = "motor-js/regex" }
quimera-frontend = { path = "motor-js/frontend" }
quimera-objetos = { path = "motor-js/objetos" }
quimera-vm = { path = "motor-js/vm" }
quimera-html = { path = "web/html" }
quimera-css = { path = "web/css" }
quimera-estilo = { path = "web/estilo" }
quimera-maquetacion = { path = "web/maquetacion" }
quimera-texto = { path = "grafico/texto" }
quimera-gpu = { path = "grafico/gpu" }
quimera-pintar = { path = "grafico/pintar" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"

# Las pruebas ejecutan benchmarks enteros (Richards, RegExp...): un poco de optimización
# las hace varias veces más rápidas sin perder las comprobaciones de desbordamiento.
[profile.dev]
opt-level = 1
