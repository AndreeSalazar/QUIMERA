[package]
name = "quimera-red"
description = "Red de QUIMERA: URLs, HTTP/1.1 propio y HTTPS con rustls (certificados de Mozilla)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.quimera]
nivel = 2
capa = "red"
no_std = false
externos = ["rustls", "webpki-roots"]

[dependencies]
quimera-comprimir.workspace = true
rustls = { version = "=0.23.20", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "=0.26.7"

[lints]
workspace = true
