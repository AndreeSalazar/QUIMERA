# Revisiones de los guardianes de QUIMERA.
#
# Cada amarillo (🟡) que se acepta queda aquí con su motivo. Si el amarillo desaparece,
# la revisión sobra y los guardianes la marcan en rojo para que se borre.
# Ver las reglas: cargo run -p quimera-guardianes -- --reglas

[[revisado]]
regla = "A-UNWRAP"
archivo = "motor-js/gc/src/lib.rs"
motivo = "Tres invariantes del montón: los índices de la guardería caben en 46 bits (está limitada por Config::guarderia), los de la zona principal en u32, y pasar de 4.294 millones de objetos vivos es un límite de diseño que debe parar el programa."

[[revisado]]
regla = "A-ALLOW"
archivo = "motor-js/frontend/src/bytecode.rs"
motivo = "missing_docs en los campos de Instr: son unos 70 operandos (dst, a, b, obj, nombre...) cuyo papel ya explica el doc de cada instrucción; documentarlos uno a uno solo repetiría el nombre."

[[revisado]]
regla = "A-UNWRAP"
archivo = "bancos/frontend/src/main.rs"
motivo = "Es un programa de medida: si el corpus no se lee o un parser falla, la medida no vale y debe pararse en ese punto con el mensaje del expect."

[[revisado]]
regla = "A-UNWRAP"
archivo = "bancos/vm/src/main.rs"
motivo = "Programa de medida: si un motor no ejecuta el script, la medida no vale y debe pararse con el mensaje del expect."

[[revisado]]
regla = "A-UNWRAP"
archivo = "bancos/web/src/main.rs"
motivo = "Programa de medida: si la página pedida no se puede leer, no hay nada que comparar y debe pararse con el mensaje del expect."
