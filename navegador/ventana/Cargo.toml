[package]
name = "quimera-ventana"
description = "La ventana de QUIMERA: abre una página y la dibuja con wgpu; se redimensiona y se desplaza."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.quimera]
nivel = 12
capa = "navegador"
no_std = false
externos = ["winit", "pollster"]

[dependencies]
quimera-html.workspace = true
quimera-dom.workspace = true
quimera-estilo.workspace = true
quimera-maquetacion.workspace = true
quimera-pintar.workspace = true
quimera-texto.workspace = true
quimera-red.workspace = true
quimera-gpu.workspace = true
quimera-imagen.workspace = true
quimera-video.workspace = true
quimera-vm.workspace = true
winit = "=0.30.12"
pollster = "=0.4.0"

[features]
# `QUIMERA_PERFIL=1`: qué funciones de JavaScript y qué instrucciones se llevan el tiempo.
perfil = ["quimera-vm/perfil"]

[lints]
workspace = true
