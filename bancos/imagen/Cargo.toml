[package]
name = "quimera-banco-imagen"
description = "Compara los decodificadores de quimera-imagen con png, jpeg-decoder y gif: mismos píxeles y velocidad."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[package.metadata.quimera]
nivel = 99
capa = "bancos"
no_std = false
# Solo los bancos de medida pueden usar crates de fuera, para comparar.
externos = ["png", "jpeg-decoder", "gif", "jpeg-encoder"]

[dependencies]
quimera-imagen.workspace = true
png = "=0.17.16"
jpeg-decoder = { version = "=0.3.1", default-features = false, features = ["platform_independent"] }
gif = "=0.13.1"
jpeg-encoder = "=0.6.0"

[lints]
workspace = true
